<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Facebook Authenticating...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #080C14;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justifyContent: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 216, 255, 0.2);
      border-top-color: #00D8FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Connecting with your Facebook account...</p>

  <script>
    (function() {
      try {
        const hash = window.location.hash.substring(1);
        const search = window.location.search.substring(1);
        const hashParams = new URLSearchParams(hash);
        const searchParams = new URLSearchParams(search);

        const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
        const error = hashParams.get('error') || searchParams.get('error_description') || searchParams.get('error');

        if (window.opener) {
          if (accessToken) {
            window.opener.postMessage({
              type: 'SMARTRIDE_FB_AUTH_SUCCESS',
              accessToken: accessToken
            }, window.location.origin);
          } else if (error) {
            window.opener.postMessage({
              type: 'SMARTRIDE_FB_AUTH_ERROR',
              error: error
            }, window.location.origin);
          }
          setTimeout(function() {
            window.close();
          }, 300);
        } else {
          // If loaded directly, redirect home
          window.location.href = '/login';
        }
      } catch (err) {
        console.error('Facebook Callback handler error:', err);
      }
    })();
  </script>
</body>
</html>

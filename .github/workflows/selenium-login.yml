name: selenium-login.yml

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Selenium E2E Web + API Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: smartride_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: 'true'
      MYSQL_HOST: '127.0.0.1'
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: 'smartride_db'
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 & MySQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, json, mbstring

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize Schema, PHP Lint & AI Unit Suites
        run: |
          for f in Backend/php/*.php; do
            php -l "$f"
          done
          php .github/scripts/ci/init_ci_db.php
          php .github/scripts/ci/test_ai_module.php
          node .github/scripts/ci/test_ai_engine.mjs
          node .github/scripts/ci/test_dynamic_ai_engine.mjs
          node .github/scripts/ci/test_places.mjs
          node .github/scripts/ci/test_safe_coords.mjs

      - name: Install CI Browser Test Harness
        run: |
          cd .github/scripts/ci
          npm install --no-audit --no-fund
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ] && [ ! -x /usr/bin/chromium-browser ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Start Servers & Run Backend API + Web E2E Audit
        run: |
          nohup php -S 0.0.0.0:5000 Backend/php/index.php >/tmp/php_api.log 2>&1 &
          nohup php -S 0.0.0.0:8080 -t web_frontend >/tmp/php_web.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          JSON_OUT=api-results.json php .github/scripts/ci/test_all_endpoints.php
          JSON_OUT=web-api-results.json node .github/scripts/ci/test_human_web.js

      - name: Dump Server Logs on Failure
        if: failure()
        run: |
          echo "=== PHP API LOG ===" && cat /tmp/php_api.log || true
          echo "=== PHP WEB LOG ===" && cat /tmp/php_web.log || true

      - name: Publish Web + API Summary
        run: |
          node -e '
            const fs = require("fs");
            const api = JSON.parse(fs.readFileSync("api-results.json", "utf8"));
            const web = JSON.parse(fs.readFileSync("web-api-results.json", "utf8"));
            const lines = [
              "### Selenium E2E Web + Backend API Summary",
              "| Suite | Executed | Passed | Failed | Status |",
              "|---|---|---|---|---|",
              `| Backend PHP + MySQL API | ${api.summary.total} | ${api.summary.passed} | ${api.summary.failed} | ${api.summary.failed === 0 ? "PASS" : "FAIL"} |`,
              `| Web Application E2E (1280x880 & 390px) | ${web.summary.total} | ${web.summary.passed} | ${web.summary.failed} | ${web.summary.failed === 0 ? "PASS" : "FAIL"} |`
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload Web & API Test Results
        uses: actions/upload-artifact@v4
        with:
          name: web-api-results
          path: |
            web-api-results.json
            api-results.json

  appium-tests:
    name: Appium Mobile Tests Dry-Run
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: smartride_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: 'true'
      MYSQL_HOST: '127.0.0.1'
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: 'smartride_db'
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 & MySQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, json, mbstring

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint & Build Android Mobile WebView Bundle
        run: |
          php .github/scripts/ci/init_ci_db.php
          cd frontend
          npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
          npx eslint src --quiet
          npm run build

      - name: Install CI Browser Test Harness
        run: |
          cd .github/scripts/ci
          npm install --no-audit --no-fund
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ] && [ ! -x /usr/bin/chromium-browser ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Run 34-Route Pixel 8 Mobile & Button Placement Audit
        run: |
          nohup php -S 0.0.0.0:5000 Backend/php/index.php >/tmp/php_mobile_api.log 2>&1 &
          (cd frontend && nohup npx vite preview --host 0.0.0.0 --port 5173 >/tmp/vite_mobile.log 2>&1 &)
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          JSON_OUT=mobile-results.json node .github/scripts/ci/test_android_app.js

      - name: Dump Mobile Server Logs on Failure
        if: failure()
        run: |
          echo "=== MOBILE PHP LOG ===" && cat /tmp/php_mobile_api.log || true
          echo "=== VITE PREVIEW LOG ===" && cat /tmp/vite_mobile.log || true

      - name: Publish Mobile Audit Summary
        run: |
          node -e '
            const fs = require("fs");
            const mob = JSON.parse(fs.readFileSync("mobile-results.json", "utf8"));
            const lines = [
              "### Android Mobile App 34-Route & Button Placement Audit",
              "| Metric | Value |",
              "|---|---|",
              `| Routes Verified | ${mob.summary.routesPassed}/${mob.summary.routesTotal} |`,
              `| Key Button Spot-Checks | ${mob.summary.buttonsPassed}/${mob.summary.buttonsTotal} |`,
              `| Layout / Layer / Image Violations | ${mob.summary.layoutViolations} |`,
              `| Console Errors | ${mob.summary.consoleErrors} |`,
              `| Status | ${mob.summary.failed === 0 && mob.summary.layoutViolations === 0 ? "PASS" : "FAIL"} |`
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload Mobile Test Results
        uses: actions/upload-artifact@v4
        with:
          name: mobile-results
          path: mobile-results.json

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: selenium-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build & Stage Production Pages Bundle
        run: |
          cd frontend
          npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          cd ..
          mkdir -p _pages_dist/mobile
          cp -r web_frontend/* _pages_dist/
          cp -r app/src/main/assets/* _pages_dist/mobile/
          echo "### Static Production Bundle Staged" >> $GITHUB_STEP_SUMMARY
          echo "Staged web_frontend + compiled Android WebView assets cleanly." >> $GITHUB_STEP_SUMMARY

      - name: Upload Pages Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartride-pages-bundle
          path: _pages_dist

  generate-report:
    name: Generate SmartRide Test Report
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Web & API Results
        uses: actions/download-artifact@v4
        with:
          name: web-api-results
          path: ci-results

      - name: Download Mobile Results
        uses: actions/download-artifact@v4
        with:
          name: mobile-results
          path: ci-results

      - name: Generate & Validate Excel Report (Report.xlsx)
        run: |
          python3 .github/scripts/ci/generate_selenium_excel.py --results-dir ci-results --out Report.xlsx

      - name: Publish Consolidated Report Summary
        run: |
          python3 - << 'EOF'
          import json, os
          api = json.load(open("ci-results/api-results.json", encoding="utf-8"))["summary"]
          web = json.load(open("ci-results/web-api-results.json", encoding="utf-8"))["summary"]
          mob = json.load(open("ci-results/mobile-results.json", encoding="utf-8"))["summary"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          rows = [
              ("Backend PHP & MySQL API", api["total"], api["passed"], api["failed"]),
              ("Web Application E2E", web["total"], web["passed"], web["failed"]),
              ("Android Mobile App (34 Routes + 27 Controls)", mob["total"], mob["passed"], mob["failed"]),
          ]
          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write("## SmartRide AI - Consolidated E2E & Mobile Test Report\n\n")
              fh.write("| Suite | Total Checks | Passed | Failed | Status |\n")
              fh.write("|---|---|---|---|---|\n")
              for name, total, passed, failed in rows:
                  status = "PASS" if failed == 0 else "FAIL"
                  fh.write(f"| {name} | {total} | {passed} | {failed} | {status} |\n")
          EOF

      - name: Upload Excel Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Report.xlsx
          path: Report.xlsx
